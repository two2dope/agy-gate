name: Gerar AntigravityGate.exe

# A cada push no main: roda os testes, monta o .exe, testa o .exe e guarda como artefato.
# Teste vermelho barra a montagem. Ao criar uma tag vX.Y.Z: além disso, publica uma Release com o .exe e as notas do CHANGELOG.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publicar o .exe numa Release desta tag (ex.: v1.0.0). Vazio = só montar."
        required: false
        default: ""
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read  # só o job de Release recebe escrita

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tk e tela virtual
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Rodar a suíte (tests/run_all.sh)
        run: |
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"
          tests/run_all.sh

  build:
    needs: tests
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ler a versão do código
        id: ver
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $m = Select-String -Path AntigravityGate.py -Pattern '^__version__ = "([^"]+)"' | Select-Object -First 1
          if (-not $m) { throw "__version__ não encontrada em AntigravityGate.py" }
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versão do código: $v"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$v") { throw "A tag $env:GITHUB_REF_NAME não bate com a versão do código ($v)" }
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -ne "v$v") { throw "release_tag $env:RELEASE_TAG não bate com a versão do código ($v)" }

      - name: Marcar a montagem (commit e data) no código
        shell: pwsh
        run: |
          $build = "$($env:GITHUB_SHA.Substring(0,7)) $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')) UTC"
          $src = Get-Content AntigravityGate.py -Raw -Encoding UTF8
          $new = $src -replace '(?m)^__build__ = "[^"]*"', "__build__ = `"$build`""
          if ($new -eq $src) { throw "__build__ não encontrado em AntigravityGate.py" }
          [IO.File]::WriteAllText((Resolve-Path AntigravityGate.py), $new, (New-Object Text.UTF8Encoding $false))
          Write-Host "Montagem: $build"

      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pip "pyinstaller==6.22.3"  # versão fixa: montagem reproduzível

      - name: Gerar o .exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --add-data "fonts;fonts" --add-data "assets;assets" --icon assets/app.ico --name AntigravityGate AntigravityGate.py

      - name: Teste de fumaça (abre o .exe sem janela e confere a carga)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $env:ANTIGRAVITY_HOME = Join-Path $env:RUNNER_TEMP "gemini-vazio"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "localappdata"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $p = Start-Process -FilePath ".\dist\AntigravityGate.exe" -ArgumentList "--selftest", "`"$out`"" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out } else { Write-Host "O .exe não gravou o resultado do autoteste" }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $out) -or -not ((Get-Content $out -Raw) -like "OK*")) { throw "Autoteste do .exe falhou (código $($p.ExitCode))" }
          if ((Get-Content $out -Raw) -notmatch "ícone ok") { throw "O .exe não achou o ícone do app (assets/ fora do pacote?)" }
          if ((Get-Content $out -Raw) -notmatch "7 fontes registradas") { throw "O .exe não registrou as 7 fontes (ícones, Inter e JetBrains Mono) (fonts/ fora do pacote?)" }

      - name: Impressão digital (SHA-256) e tamanho
        id: hash
        shell: pwsh
        run: |
          $h = (Get-FileHash .\dist\AntigravityGate.exe -Algorithm SHA256).Hash
          "sha256=$h" >> $env:GITHUB_OUTPUT
          Write-Host "SHA-256: $h"
          "{0:N1} MB" -f ((Get-Item .\dist\AntigravityGate.exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: AntigravityGate-windows
          path: dist/AntigravityGate.exe
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AntigravityGate-windows
          path: dist

      - name: Publicar a Release (rascunho, anexa o .exe, publica; cada passo conferido)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          # Não chamar a função de "Gh": o PowerShell não diferencia maiúsculas e ela chamaria a si mesma (estouro de pilha).
          function Invoke-GhChecked { & gh @args; if ($LASTEXITCODE -ne 0) { throw "gh $($args -join ' ') falhou (código $LASTEXITCODE)" } }
          $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { $env:GITHUB_REF_NAME }
          if (-not (Test-Path dist/AntigravityGate.exe)) { throw "artefato sem AntigravityGate.exe" }
          $log = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)")
          if (-not $m.Success) { throw "CHANGELOG.md sem a seção [$($env:VERSION)]: registre a versão antes de publicar" }
          $sha = "**SHA-256 do .exe:** ``$($env:SHA256)```n`nO .exe não é assinado: o Windows pode mostrar o aviso do SmartScreen na primeira vez (Mais informações, Executar assim mesmo)."
          # Release já criada pela tela do GitHub? Erro diferente de "não encontrada" interrompe (não cria duplicata).
          $view = & gh release view $tag --json isDraft,body 2>&1
          if ($LASTEXITCODE -eq 0) {
            $rel = $view | ConvertFrom-Json
            Invoke-GhChecked release upload $tag dist/AntigravityGate.exe --clobber
            # Preserva notas, título e marcações escolhidos na tela; só acrescenta o SHA-256 (e as notas do CHANGELOG se estiver vazia).
            $body = if ([string]::IsNullOrWhiteSpace($rel.body)) { $m.Groups[1].Value.Trim() } else { $rel.body.Trim() }
            $body = ($body -replace '(?s)\s*\*\*SHA-256 do \.exe:\*\*.*$', '').Trim()   # nova execução: não duplica o bloco
            Set-Content -Path release_notes.md -Value "$body`n`n$sha" -Encoding UTF8
            Invoke-GhChecked release edit $tag --notes-file release_notes.md
            if ($rel.isDraft) { Invoke-GhChecked release edit $tag --draft=false }   # rascunho de uma execução que falhou: publica agora
          } elseif ("$view" -match "release not found") {
            Set-Content -Path release_notes.md -Value "$($m.Groups[1].Value.Trim())`n`n$sha" -Encoding UTF8
            $create = @("release", "create", $tag, "--draft", "--title", "AntigravityGate $tag", "--notes-file", "release_notes.md")
            if ($env:VERSION -like "0.*") { $create += "--prerelease" }
            Invoke-GhChecked @create
            Invoke-GhChecked release upload $tag dist/AntigravityGate.exe
            Invoke-GhChecked release edit $tag --draft=false   # só fica pública depois de ter o .exe
          } else {
            throw "gh release view falhou: $view"
          }
          $assets = (& gh release view $tag --json assets | ConvertFrom-Json).assets.name
          if ($assets -notcontains "AntigravityGate.exe") { throw "a Release ficou sem AntigravityGate.exe" }
          Write-Host "Release $tag publicada com AntigravityGate.exe"
